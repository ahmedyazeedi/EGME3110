<script>
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mp=Math.pow,mw=mp(2,32),L='length',i,j,result='';
  var words=[],bl=ascii[L]*8;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k[L];
  var comp={};
  for(var c=2;pc<64;c++){
    if(!comp[c]){
      for(i=0;i<313;i+=c)comp[i]=c;
      hash[pc]=(mp(c,.5)*mw)|0;
      k[pc++]=(mp(c,1/3)*mw)|0;
    }
  }
  ascii+='\x80';
  while(ascii[L]%64-56)ascii+='\x00';
  for(i=0;i<ascii[L];i++){j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8;}
  words[words[L]]=((bl/mw)|0);
  words[words[L]]=(bl);
  for(j=0;j<words[L];){
    var w=words.slice(j,j+=16),old=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10))|0));
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}
  return result;
}
function hashSeed(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;}
function rng(s){let a=hashSeed(s);return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
function shuffle(r,arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function genQ1(r){
  for(let t=0;t<2000;t++){
    const n=ri(r,5,9),h=ri(r,0,2),d=pick(r,[-1,0,1,1,1,2]);
    const num=3*(n-1)-h-d;if(num%2)continue;
    const j=num/2;if(j<n||j>2*n-2)continue;
    return{n,j,h,dof:d,cls:d>0?'M':(d===0?'S':'L')};
  }
  return{n:6,j:7,h:0,dof:1,cls:'M'};
}
function genQ2(r){
  for(let t=0;t<5000;t++){
    const gr=r()<0.6;
    const s=5*ri(r,6,14),l=5*ri(r,22,36);
    const p=5*ri(r,s/5+1,l/5-1),q=5*ri(r,s/5+1,l/5-1);
    if(new Set([s,l,p,q]).size<4)continue;
    const a=s+l,b=p+q;
    if(gr?!(a<b-10):!(a>b+10))continue;
    const roles=shuffle(r,[s,l,p,q]);
    const [g,c,cp,rk]=roles;
    let ty;
    if(!gr)ty='TR';else if(g===s)ty='DC';else if(cp===s)ty='DR';else ty='CR';
    return{g,c,cp,rk,sl:a,pq:b,gr:gr?'Y':'N',ty};
  }
}
function genQ3(r){
  const n=pick(r,[6,8,10]);
  const n4=ri(r,0,Math.floor((n-4)/2));
  return{n,n4,j:(3*n-4)/2,n2:4+n4,n3:n-4-2*n4};
}
function genQ45(r){
  for(let t=0;t<5000;t++){
    const big=pick(r,[300,350,400,450,500,600]),small=pick(r,[100,150,200,250]);
    if(big-small<100)continue;
    const x=50*ri(r,16,36);
    if(x<1.5*(big+small))continue;
    const bigDrives=r()<0.5;
    const dA=bigDrives?big:small,dB=bigDrives?small:big;
    const N=50*ri(r,6,18),mu=pick(r,[0.25,0.28,0.30,0.32,0.35]),T1=100*ri(r,6,15);
    const r1=big/2,r2=small/2,df=r1-r2;
    const al=Math.asin(df/x),alA=df/x;
    const thE=Math.PI-2*al,thA=Math.PI-2*alA;
    const Lx=2*Math.sqrt(x*x-df*df)+r1*(Math.PI+2*al)+r2*(Math.PI-2*al);
    const La=Math.PI/2*(big+small)+(big-small)*(big-small)/(4*x)+2*x;
    const v=Math.PI*(dA/1000)*N/60;
    const mk=th=>{const ratio=Math.exp(mu*th),T2=T1/ratio;return{ratio,T2,P:(T1-T2)*v/1000};};
    return{dA,dB,x,N,mu,T1,big,small,Lx,La,thE:thE*180/Math.PI,thA:thA*180/Math.PI,v,e:mk(thE),a:mk(thA)};
  }
}
function genQ5(r){return{s1:ri(r,1,2),s2:ri(r,1,3),t:pick(r,[6,8,10,12])};}

const fmt1=(x,d)=>(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);
function numOpts(val,alts,d,unit,tol){tol=tol||0.015;const out=[];
  for(const a of alts){if(!isFinite(a)||a<=0)continue;if(Math.abs(a-val)<=tol*Math.abs(val))continue;if(out.some(b=>Math.abs(b-a)<=tol*Math.abs(val)))continue;out.push(a);}
  if(out.length<3)return null;return{ok:fmt1(val,d)+unit,bad:out.slice(0,3).map(a=>fmt1(a,d)+unit)};}
function intOpts(val,alts){const out=[];for(const a of alts.concat([val+1,val-1,val+2,val-2,val+3])){if(a===val||out.includes(a))continue;out.push(a);if(out.length===3)break;}return{ok:String(val),bad:out.map(String)};}
const DLAB=d=>d>0?'a mechanism':(d===0?'a rigid structure':'an over-constrained structure');
const LAB4=['Open belt drive','Cross belt drive','Quarter-turn (right-angle) belt drive','Compound belt drive','Stepped (cone) pulley drive','Fast and loose pulley drive'];
function fourBar(r){for(let t=0;t<999;t++){const gr=r()<0.7,s=5*ri(r,4,12),l=5*ri(r,20,34),p=5*ri(r,s/5+1,l/5-1),q=5*ri(r,s/5+1,l/5-1);
  if(new Set([s,l,p,q]).size<4)continue;const a=s+l,b=p+q;if(gr?!(a<b-10):!(a>b+10))continue;return{s,l,p,q,gr,d:a-b};}}
const MB=[
/* ---- Chapter 1/2: mechanisms and synthesis ---- */
{g:0,f:r=>{for(let t=0;t<99;t++){const n=ri(r,5,10),j=ri(r,n,2*n-3),h=ri(r,0,2),d=3*(n-1)-2*j-h;if(d<-1||d>3)continue;
  const o=intOpts(d,[3*n-2*j-h,3*(n-1)-2*j,3*(n-1)-2*j+h,3*(n-1)-j-h]);

{g:0,f:r=>{for(let t=0;t<99;t++){const n=ri(r,4,9),j=ri(r,n,2*n-3),d=3*(n-1)-2*j;if(d<-2||d>2)continue;
  const w=x=>`DoF = ${x}: ${DLAB(x)}`;const o={ok:w(d),bad:[w(d+1),w(d-1),w(d+2)]};
  return{t:`A planar linkage has n = ${n} links (including the frame) and j = ${j} pin joints only (no higher pairs). Which statement is correct?`,...o};}}},
{g:0,f:r=>{for(let t=0;t<99;t++){const n=ri(r,4,7),j=ri(r,n-1,2*n-3),h=ri(r,1,2),K=3*(n-1)-2*j-h,rr=ri(r,1,2);if(K-rr<1||K>4)continue;

{g:0,f:r=>{const B=pick(r,[[4,4],[5,5],[6,7],[7,8]]),k=ri(r,1,3),n=B[0]+k,j=B[1]+2*k,pl=3*(n-1)-2*j,tr=3*(B[0]-1)-2*B[1];
  const o=intOpts(tr,[pl,tr+1,tr-1,tr+2]);

/* ---- Chapter 2: synthesis ---- */
{g:1,f:r=>{const n=pick(r,[6,8,10,12,14]),j=(3*n-4)/2;const o=intOpts(j,[3*n/2,j+1,j-1,n+j-3]);

{g:1,f:r=>{for(let t=0;t<99;t++){const n=pick(r,[8,10,12,14]),n4=ri(r,1,3),n3=n-4-2*n4;if(n3<0)continue;
  const o=intOpts(n4,[n-4-n3,(n-n3)/2,n4+1,Math.max(n4-1,0)+0]);
  return{t:`A one-DoF planar chain with pin joints only has n = ${n} links: ${n3} ternary links, some binary links and some quaternary links (no link has more than four joints). How many quaternary links does it have?`,...o};}}},
{g:1,f:r=>{const F=fourBar(r),ring=shuffle(r,[F.s,F.l,F.p,F.q]),[g,c,cp,rk]=ring;
  const ty=!F.gr?'TR':(g===F.s?'DC':(cp===F.s?'DR':'CR')),keys=['CR','DC','DR','TR'];
  return{t:`A four-bar linkage has a frame (fixed link) of ${g} mm, an input link of ${c} mm, a coupler of ${cp} mm and an output link of ${rk} mm. What type of mechanism is it?`,ok:TYPE_LABEL[ty],bad:keys.filter(k=>k!==ty).map(k=>TYPE_LABEL[k])};}},
{g:1,f:r=>{for(let t=0;t<99;t++){const F=fourBar(r),d=F.d,Y=(F.s+F.p)-(F.l+F.q);if(Y===d||Y===-d||d===0)continue;
  const cc=x=>x<0?'Grashof (a link can turn fully)':'not Grashof (no link can turn fully)',opp=x=>x<0?'not Grashof (no link can turn fully)':'Grashof (a link can turn fully)';
  const w=(v,s)=>`(s + l) − (p + q) = ${v} mm, ${s}`;const ls=shuffle(r,[F.s,F.l,F.p,F.q]);
  return{t:`A four-bar linkage has links of ${ls.join(', ')} mm. With s = shortest, l = longest and p, q the other two, what is (s + l) − (p + q) and what does it show?`,ok:w(d,cc(d)),bad:[w(-d,cc(d)),w(d,opp(d)),w(Y,cc(Y))]};}}},
{g:1,f:r=>{for(let t=0;t<99;t++){const a=5*ri(r,2,12),b=5*ri(r,2,12),dx=ri(r,-6,6),dy=ri(r,-6,6);if(!dx&&!dy)continue;
  const C1=[a,b],C2=[a+2*dx,b+2*dy],M=[a+dx,b+dy],k=pick(r,[1,2,3,-1,-2]),P=[M[0]-k*dy,M[1]+k*dx];
  const eq=Q=>Math.abs((Q[0]-C1[0])**2+(Q[1]-C1[1])**2-(Q[0]-C2[0])**2-(Q[1]-C2[1])**2)<1e-9;
  const cand=[[M[0]+dx,M[1]+dy],[M[0]-2*dx,M[1]-2*dy],[C1[0]-dy,C1[1]+dx],[C2[0]-dy,C2[1]+dx],[M[0]+3*dx,M[1]+3*dy]].filter(Q=>!eq(Q));
  const str=Q=>`(${Q[0]}, ${Q[1]})`,bad=[];for(const Q of cand)if(!bad.includes(str(Q))&&str(Q)!==str(P))bad.push(str(Q));if(bad.length<3||!eq(P))continue;
  return{t:`In two-position synthesis, a coupler point C moves from C1 = (${C1[0]}, ${C1[1]}) to C2 = (${C2[0]}, ${C2[1]}) (coordinates in mm). The fixed pivot that carries C must lie on the perpendicular bisector of C1C2. Which point could be that pivot?`,ok:str(P),bad:bad.slice(0,3)};}}},
{g:1,f:r=>{for(let t=0;t<99;t++){const al=10*ri(r,4,10),be=5*ri(r,4,12);if(al/2===be||al===be||be/2===al/2)continue;

{g:2,f:r=>{for(let t=0;t<99;t++){const d1=50*ri(r,2,12),d2=50*ri(r,2,12),N=50*ri(r,4,36);if(d1===d2)continue;const v=N*d1/d2;

{g:2,f:r=>{for(let t=0;t<99;t++){const d1=50*ri(r,2,12),d2=50*ri(r,2,12),N=50*ri(r,4,36),tt=pick(r,[5,6,8,10,12]);if(d1===d2)continue;const v=N*(d1+tt)/(d2+tt);

  <label>Password<input type="password" id="lpw" autocomplete="current-password"></label>
  <p><button id="lgo">Sign in</button></p>
  <div class="err" id="lerr"></div></div>`;
  let busy=false;
  const go=async()=>{if(busy)return;const id=normId($('#lid').value),pw=String($('#lpw').value||'').trim().toUpperCase(),er=$('#lerr');
    if(!(window.crypto&&crypto.subtle)){er.textContent='This browser cannot sign in here. Open the page over https or from your computer.';return;}
    busy=true;er.textContent='Checking…';$('#lgo').disabled=true;
    let ok=false;try{const rec=ROSTER[idKey(id)];if(rec)ok=(await pbk(pw,rec[0]+':'+id))===rec[1];else await pbk(pw,'x:'+id);}catch(e){}
    busy=false;
    if(ok)return studentView(id,false);
    $('#lgo').disabled=false;er.textContent='ID or password not recognised.';};
  $('#lgo').onclick=go;$('#lpw').onkeydown=e=>{if(e.key==='Enter')go();};
}

/* ---------- paper ---------- */
const sel=(id,opts)=>`<select id="${id}"><option value="">Select…</option>${opts.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select>`;
const numIn=(id,unit)=>`<label>${unit}<input type="text" inputmode="decimal" id="${id}" autocomplete="off"></label>`;
function paperHTML(P,model){
  const a=model?modelAnswers(P):null,Q=P.q45,F=P.q5,k5=q5Model(Q,F);
  const m=(txt)=>model?`<div class="ans"><b>Model:</b> ${txt}</div>`:'';
  const f=(x,d)=>x.toFixed(d==null?2:d);
  return `
  <div class="card"><h2>Question 1 <span class="mk">1.5 marks</span></h2>
  <p>A planar linkage has <b>n = ${P.q1.n}</b> links (including the frame). It contains <b>${P.q1.j}</b> lower pairs (each removes 2 DoF) and ${P.q1.h?`<b>${P.q1.h}</b> higher pair${P.q1.h>1?'s':''} (each removes 1 DoF)`:'<b>no</b> higher pairs'}. There are no redundant links or pairs.</p>
  <div class="row">${numIn('q1dof','(a) Degrees of freedom (Kutzbach) [1.0]')}<label>(b) Classification [0.5]${sel('q1cls',[['M','Mechanism'],['S','Structure (rigid)'],['L','Over-constrained (statically indeterminate)']])}</label></div>
  ${m(`DoF = 3(${P.q1.n}−1) − 2(${P.q1.j}) − ${P.q1.h} = ${P.q1.dof}; ${CLS_LABEL[P.q1.cls]}`)}</div>

  <div class="card"><h2>Question 2 <span class="mk">2 marks</span></h2>
  <p>A four-bar linkage has: ground (fixed) link <b>${P.q2.g} mm</b>, input link <b>${P.q2.c} mm</b>, coupler <b>${P.q2.cp} mm</b>, output link <b>${P.q2.rk} mm</b>.</p>
  <div class="row">${numIn('q2sl','(a) s + l (mm) [0.5]')}${numIn('q2pq','(b) p + q (mm) [0.5]')}
  <label>(c) Satisfies Grashof's criterion? [0.5]${sel('q2gr',[['Y','Yes'],['N','No']])}</label>
  <label>(d) Type of mechanism, with the ground link fixed [0.5]${sel('q2ty',Object.entries(TYPE_LABEL))}</label></div>
  ${m(`s+l = ${P.q2.sl}, p+q = ${P.q2.pq}; Grashof: ${P.q2.gr==='Y'?'yes':'no'}; ${TYPE_LABEL[P.q2.ty]}`)}</div>

  <div class="card"><h2>Question 3 <span class="mk">1.5 marks</span></h2>
  <p>A planar mechanism has <b>n = ${P.q3.n}</b> links and <b>one degree of freedom</b>, with pin joints only. It contains exactly <b>${P.q3.n4}</b> quaternary link${P.q3.n4===1?'':'s'} (four joints each) and no link with more than four joints; every other link is binary or ternary.</p>
  <div class="row">${numIn('q3j','(a) Number of pin joints, j [0.5]')}${numIn('q3n2','(b) Binary links, n₂ [0.5]')}${numIn('q3n3','(c) Ternary links, n₃ [0.5]')}</div>
  ${m(`j = ${P.q3.j}, n₂ = ${P.q3.n2}, n₃ = ${P.q3.n3}`)}</div>

  <div class="card"><h2>Question 4 <span class="mk">1 mark</span></h2>
  <p>An open flat-belt drive connects two parallel shafts. Driver pulley A has diameter <b>${Q.dA} mm</b>, driven pulley B has diameter <b>${Q.dB} mm</b>, and the centre distance is <b>${Q.x} mm</b>. Neglect belt thickness.</p>
  <div class="row">${numIn('q4L','Length of belt (mm) [1.0]')}</div>
  ${m(`L = ${f(Q.Lx,1)} mm (approx. formula ${f(Q.La,1)})`)}</div>

  <div class="card"><h2>Question 5 <span class="mk">2 marks</span></h2>
  <p>For the same drive, driver A rotates at <b>${Q.N} rpm</b>. The belt is <b>${F.t} mm</b> thick. Slip between the driver and the belt is <b>s₁ = ${F.s1}%</b> and slip between the belt and the driven pulley is <b>s₂ = ${F.s2}%</b>.</p>
  <div class="row">${numIn('q5vr','(a) Velocity ratio N₂/N₁ (no slip, neglect thickness) [0.5]')}${numIn('q5nt','(b) Driven speed N₂ (rpm), allowing for belt thickness, no slip [0.5]')}${numIn('q5ns','(c) Driven speed N₂ (rpm), allowing for slip, neglecting thickness [0.5]')}${numIn('q5bv','(d) Belt speed over the driver (m/s), allowing for slip s₁ [0.5]')}</div>
  ${m(`N₂/N₁ = ${f(k5.vr,3)}; N₂ (thickness) = ${f(k5.nt,1)} rpm; N₂ (slip) = ${f(k5.ns,1)} rpm; v = ${f(k5.bv,2)} m/s`)}</div>

  <div class="card"><h2>Question 6 — Multiple choice <span class="mk">2 marks</span></h2>
  <p>Ten questions, 0.2 mark each. Choose one answer for each. The questions use numbers specific to your student ID.</p>
  ${P.mcq.map((m,k)=>`<p><b>${k+1}.</b> ${esc(m.t)}</p><div class="row">${sel('m'+(k+1),m.o.map((o,j)=>['ABCD'[j],'ABCD'[j]+'. '+o]))}</div>${model?`<div class="ans"><b>Model:</b> ${m.c}</div>`:''}`).join('')}</div>`;
}
const FIELDS={q1dof:['q1','dof'],q1cls:['q1','cls'],q2sl:['q2','sl'],q2pq:['q2','pq'],q2gr:['q2','gr'],q2ty:['q2','ty'],q3j:['q3','j'],q3n2:['q3','n2'],q3n3:['q3','n3'],q4L:['q4','L'],q5vr:['q5','vr'],q5nt:['q5','nt'],q5ns:['q5','ns'],q5bv:['q5','bv'],m1:['mcq','m1'],m2:['mcq','m2'],m3:['mcq','m3'],m4:['mcq','m4'],m5:['mcq','m5'],m6:['mcq','m6'],m7:['mcq','m7'],m8:['mcq','m8'],m9:['mcq','m9'],m10:['mcq','m10']};
function collect(){const A={q1:{},q2:{},q3:{},q4:{},q5:{},mcq:{}};for(const k in FIELDS){const[q,f]=FIELDS[k];A[q][f]=($('#'+k).value||'').trim();}return A;}
function fill(A){for(const k in FIELDS){const[q,f]=FIELDS[k];if(A&&A[q]&&A[q][f]!=null)$('#'+k).value=A[q][f];}}

/* ---------- student ---------- */
function studentView(id,preview){
  const P=genPaper(id),now=Date.now(),inst=preview,demo=isTest(id);
  let head=`<div class="top"><div><b>Student ID:</b> <span class="fig">${esc(id)}</span></div><button class="sec" id="lo">Sign out</button></div>`;
  if(!inst&&!demo&&now<OPEN_TS){app.innerHTML=head+`<div class="card"><h2>Not open yet</h2><p>This assessment opens on <b>${fmt(OPEN_TS)}</b>. Please come back then.</p></div>`;$('#lo').onclick=loginView;return;}
  const late=now>DUE_TS;
  app.innerHTML=head+`
  <div class="card"><h2>Instructions</h2>
  <ul><li>Individual work, <b>10% of the course mark</b>. Your data are unique to your student ID.</li>
  <li>Covers Chapters 1–3 up to Week 10 (mechanisms, synthesis, belt drives; gears in outline). Show your working on paper; you may be asked for it.</li>
  <li>Your answers are <b>not checked on this page</b>. When finished, tick the box, press <b>Generate submission</b>, <b>download the file</b> and upload it to the Teams assignment before the deadline.</li>
  <li>Your answers are saved in this browser while you work, but only the uploaded submission file counts.</li></ul>
  <p class="note">Opened: ${fmt(OPEN_TS)} &middot; Due: <b>${fmt(DUE_TS)}</b></p>
  ${late&&!inst&&!demo?`<div class="banner warn">The due date has passed. A submission generated now is flagged as late.</div>`:''}</div>
  ${paperHTML(P,inst)}
  ${inst?'':`<div class="card"><label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink)"><input type="checkbox" id="hon" style="margin-top:4px"> <span>I confirm this is my own work and that I have not shared my answers or data.</span></label>
  <p><button id="gen" disabled>Generate submission</button></p><div id="sub"></div></div>`}`;
  $('#lo').onclick=loginView;
  const key='egme3110a1:'+id;
  if(!inst){try{const s=localStorage.getItem(key);if(s)fill(JSON.parse(s));}catch(e){}}
  app.addEventListener('input',()=>{if(!inst){try{localStorage.setItem(key,JSON.stringify(collect()));}catch(e){}}});
  if(inst)return;
  $('#hon').onchange=e=>$('#gen').disabled=!e.target.checked;
  $('#gen').onclick=()=>{
    const A=collect(),ts=Date.now(),payload=JSON.stringify({v:6,id,ts,a:A});
    const chk=sha256(payload+'|EGME3110-A1').slice(0,8);
    const code=btoa(unescape(encodeURIComponent(payload)))+'.'+chk;
    const blank=Object.values(FIELDS).filter(([q,f])=>!A[q][f]).length;
    const lines=['EGME3110 ASSESSMENT 1 — SUBMISSION'+(isTest(id)?' (TEST ACCOUNT)':''),'Student ID: '+id,'Generated: '+fmt(ts)+(ts>DUE_TS?'  [LATE]':''),'',
    'Q1: DoF='+A.q1.dof+' | class='+A.q1.cls,'Q2: s+l='+A.q2.sl+' | p+q='+A.q2.pq+' | Grashof='+A.q2.gr+' | type='+A.q2.ty,
    'Q3: j='+A.q3.j+' | n2='+A.q3.n2+' | n3='+A.q3.n3,'Q4: L='+A.q4.L,
    'Q5: N2/N1='+A.q5.vr+' | N2(t)='+A.q5.nt+' | N2(slip)='+A.q5.ns+' | v='+A.q5.bv,'Q6 (MCQ): '+Array.from({length:10},(_,i)=>(i+1)+'='+(A.mcq['m'+(i+1)]||'-')).join(' '),'','CODE: '+code];
    const txt=lines.join('\n');
    const fname='EGME3110_A1_'+String(id).replace(/[^A-Za-z0-9]/g,'')+'.txt';
    $('#sub').innerHTML=`<div class="banner info">${blank?`<b>${blank} field(s) are blank.</b> You can go back and fill them, then generate again. `:''}Your submission file is <b>${fname}</b>. Download it, then upload that file in the Teams assignment. Do not edit the file.</div>
    <p><button id="dl">Download submission file</button> <button class="sec" id="cp">Copy text instead</button></p>
    <details><summary class="note">Show the submission text</summary><textarea class="out" id="subtxt" rows="14" readonly></textarea></details>`;
    $('#subtxt').value=txt;$('#subtxt').onclick=e=>e.target.select();
    const dl=()=>{try{const bl=new Blob([txt],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}catch(e){alert('Your browser could not create the file. Use "Copy text instead" and paste into a text file named '+fname);}};
    $('#dl').onclick=dl;
    $('#cp').onclick=e=>{$('#subtxt').select();copyText(txt,e.target);};
    $('#sub').scrollIntoView({behavior:'smooth'});
  };
}


loginView();
